<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>世界杯活动移动端</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#075fd4;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif}.app{width:100%;max-width:430px;min-height:100vh;margin:auto;background:linear-gradient(180deg,#18a8ee 0,#0874ee 24%,#075fd4 100%);overflow:hidden;position:relative}.top{height:50px;background:#121820;display:flex;align-items:center;justify-content:space-between;padding:0 14px;position:sticky;top:0;z-index:20}.logo{font-weight:900;color:#ff9b1b;font-size:20px}.top-btn{border:0;background:#ff8a0a;color:#fff;border-radius:18px;padding:7px 20px;font-weight:700}.hero{height:205px;display:flex;align-items:center;justify-content:center;gap:9px;background:linear-gradient(135deg,#ff6542 0 36%,#0fcfb8 36% 72%,#3bddcb 72%);position:relative;overflow:hidden}.hero:after{content:"";position:absolute;width:250px;height:250px;border:28px solid rgba(255,255,255,.1);border-radius:50%;right:-125px;bottom:-135px}.mascots{font-size:44px;letter-spacing:-13px;z-index:1}.hero-copy{text-align:center;z-index:1;text-shadow:0 3px 0 #1766c4}.hero-copy small{font-weight:900;font-style:italic}.hero-copy h1{font-size:28px;line-height:1.1;margin:5px 0;font-style:italic}.countdown{padding:15px 8px;background:linear-gradient(90deg,#ff7816,#ff9d25);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:7px;font-weight:900}.countdown strong{font-size:19px}.time{display:flex;align-items:center;gap:3px;font-size:12px}.digit{background:#fff;color:#ff6e20;padding:6px 5px;border-radius:3px;font-size:17px}.bet{border:0;background:#ffe469;color:#352500;border-radius:6px;padding:7px 10px;font-weight:900}.main{padding:14px 12px 70px;background-image:radial-gradient(circle at 15% 15%,rgba(255,255,255,.09) 0 60px,transparent 61px)}.carousel{height:145px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.promo{border-radius:13px;background:linear-gradient(145deg,#fff,#eaf6ff);color:#173864;display:flex;align-items:center;justify-content:center;font-size:56px;box-shadow:0 4px 0 rgba(0,38,115,.25)}.dots{text-align:center;padding:11px 0}.dots i{display:inline-block;width:9px;height:9px;background:#fff;border-radius:50%;margin:0 5px}.dots i:first-child{background:#ff1d52}.tabs{display:flex;gap:7px;overflow-x:auto;padding:9px 7px 12px;border:3px dashed #f22;border-radius:5px;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}.tab{flex:0 0 132px;border:0;border-radius:10px;color:#fff;padding:11px 5px;font-size:14px;font-weight:800;white-space:nowrap}.tab:nth-child(1){background:#174fe4}.tab:nth-child(2){background:#d82e4d}.tab:nth-child(3){background:#199329}.tab.active{outline:3px solid rgba(255,255,255,.35)}.panel{display:none}.panel.active{display:block}.title{text-align:center;font-size:26px;margin:14px 0;text-shadow:0 3px 0 #1755ad}.groups{display:grid;grid-template-columns:1fr 1fr;gap:9px;border:1px solid rgba(255,255,255,.55);border-radius:16px;padding:10px}.group{background:#f7f9ff;color:#202c39;border-radius:9px;overflow:hidden}.group h3{margin:0;background:#178f56;color:#fff;text-align:center;padding:5px}.group:nth-child(2n) h3{background:#dd2842}.team{border-top:1px solid #b7c0cc;padding:5px 8px;font-weight:700;font-size:13px}.matches{display:grid;gap:10px;margin-top:12px}.match{background:#f7f8ff;color:#111;border-radius:8px;overflow:hidden}.match-head{background:#050505;color:#fff;padding:6px 8px;display:flex;justify-content:space-between;font-size:11px;font-weight:800}.match-body{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;text-align:center;padding:10px 6px;font-size:15px;font-weight:800}.other{background:rgba(0,46,133,.38);border:1px solid rgba(255,255,255,.55);border-radius:14px;padding:18px 12px;text-align:center}.cards{display:grid;gap:10px}.card{background:#fff;color:#17345f;border-radius:12px;padding:18px;font-weight:800}.home{position:fixed;left:50%;transform:translateX(-50%);bottom:12px;background:rgba(9,24,44,.88);color:#fff;text-decoration:none;padding:9px 18px;border-radius:22px;font-size:13px}
</style></head><body><div class="app"><header class="top"><div class="logo">⚽ V.VIP</div><button class="top-btn">充值</button><span>☰</span></header><section class="hero"><div class="mascots">🐯🫎🦅</div><div class="hero-copy"><small>V-SPORT</small><h1>2026美加墨世界杯<br>狂欢专区</h1></div></section><section class="countdown"><strong>🏆 进行中</strong><div class="time"><span class="digit">00</span>天<span class="digit" id="h">08</span>时<span class="digit" id="m">26</span>分<span class="digit" id="s">15</span>秒</div><button class="bet">立即投注</button></section><main class="main"><div class="carousel"><div class="promo">⚽</div><div class="promo">🏆</div></div><div class="dots"><i></i><i></i><i></i><i></i></div><nav class="tabs"><button class="tab active" data-panel="schedule">🏆 世界杯赛程</button><button class="tab" data-panel="stars">⚽ 球星情报站</button><button class="tab" data-panel="history">🏟 绿茵史诗</button></nav><section class="panel active" id="schedule"><h2 class="title">／ 小组赛分组 ／</h2><div class="groups" id="groups"></div><div class="matches" id="matches"></div></section><section class="panel other" id="stars"><h2>球星情报站</h2><div class="cards"><div class="card">锋线焦点<br><small>速度与射术的巅峰较量</small></div><div class="card">中场大师<br><small>掌控比赛节奏与创造力</small></div></div></section><section class="panel other" id="history"><h2>绿茵史诗</h2><div class="cards"><div class="card">经典决赛<br><small>重温世界杯传奇之夜</small></div><div class="card">冠军之路<br><small>记录荣耀背后的坚持</small></div></div></section></main><a class="home" href="index.html">返回后台入口</a></div>
<script>const data={A:['🇲🇽 墨西哥','🇿🇦 南非','🇰🇷 韩国','🇨🇿 捷克'],B:['🇨🇦 加拿大','🇧🇦 波黑','🇨🇭 瑞士','🇵🇱 波兰'],C:['🇧🇷 巴西','🇲🇦 摩洛哥','🇭🇹 海地','🏴 苏格兰'],D:['🇺🇸 美国','🇪🇬 埃及','🇦🇺 澳大利亚','🇹🇷 土耳其'],E:['🇩🇪 德国','🇨🇼 库索拉','🇨🇮 科特迪瓦','🇪🇨 厄瓜多尔'],F:['🇳🇱 荷兰','🇯🇵 日本','🇹🇳 突尼斯','🇸🇪 瑞典']};const groupBox=document.getElementById('groups'),matchBox=document.getElementById('matches');groupBox.innerHTML=Object.entries(data).map(([g,t])=>`<div class="group"><h3>${g}组</h3>${t.map(x=>`<div class="team">${x}</div>`).join('')}</div>`).join('');const games=[['墨西哥 🇲🇽','6/12 03:00','🇿🇦 南非','A组'],['韩国 🇰🇷','6/12 10:00','🇨🇿 捷克','A组'],['加拿大 🇨🇦','6/13 03:00','🇧🇦 波黑','B组'],['美国 🇺🇸','6/13 09:00','🇵🇾 巴拉圭','D组']];matchBox.innerHTML=games.map(x=>`<article class="match"><div class="match-head"><span>FIFA World Cup 2026™</span><span>小组赛：${x[3]}</span></div><div class="match-body"><span>${x[0]}</span><b>${x[1]}</b><span>${x[2]}</span></div></article>`).join('');document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab,.panel').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById(b.dataset.panel).classList.add('active')});const hb=document.getElementById('h'),mb=document.getElementById('m'),sb=document.getElementById('s');let r=30375;setInterval(()=>{r=Math.max(0,r-1);hb.textContent=String(Math.floor(r/3600)).padStart(2,'0');mb.textContent=String(Math.floor(r%3600/60)).padStart(2,'0');sb.textContent=String(r%60).padStart(2,'0')},1000)</script></body></html>
